<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>vpstream</title>
<style>
  :root {
    --bg: #0d0f14; --surface: #161a22; --surface-2: #1d222c; --line: #2a303c;
    --text: #e8eaf0; --muted: #8e96a8; --accent: #8aa2ff; --accent-ink: #0d0f14;
    --ok: #3fcf8e; --warn: #f2b84b; --bad: #f06b6b; --radius: 14px;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f0f2f6; --line: #e1e4ea;
      --text: #161a22; --muted: #667085; --accent: #3b5bdb; --accent-ink: #ffffff;
      --ok: #12a26a; --warn: #b7791f; --bad: #d64545;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }

  /* --- header and tabs */
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #c38bff); color: var(--accent-ink); font-weight: 800; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .brand .ver { color: var(--muted); font-size: 13px; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.off { background: var(--bad); }
  nav { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  nav button { flex: 1; min-width: 90px; border: 0; background: none; padding: 10px 8px 12px; cursor: pointer;
    color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; position: relative; }
  nav button.on { color: var(--text); border-color: var(--accent); }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px;
    background: var(--warn); color: #1b1300; font-size: 12px; line-height: 20px; font-weight: 700; }

  main { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  .notice { border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--warn) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); font-size: 14px; }
  .notice.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface));
    border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }

  /* --- cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 .muted { font-weight: 500; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stack { display: grid; gap: 10px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* --- controls */
  .btn { border: 1px solid var(--line); background: var(--surface-2); padding: 10px 14px; border-radius: 10px;
    cursor: pointer; font-weight: 600; min-height: 42px; display: inline-flex; align-items: center; gap: 6px;
    justify-content: center; transition: transform .06s, background .15s, border-color .15s; }
  .btn:active { transform: scale(.98); }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.danger.solid { background: var(--bad); color: #fff; border-color: transparent; }
  .btn.ghost { background: transparent; }
  .btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn.wide { width: 100%; }
  label.field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=number], select { width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text); min-height: 44px; font-weight: 500; }
  input:focus, select:focus, .btn:focus-visible, nav button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 9px; cursor: pointer;
    font-weight: 600; color: var(--muted); min-height: 40px; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .seg button small { display: block; font-weight: 500; font-size: 11px; opacity: .8; }
  details summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; padding: 4px 0; }
  .grid2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

  /* --- pills and progress */
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .progress { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #c38bff);
    border-radius: 4px; transition: width .6s ease; }

  /* --- the live stream */
  .hero { display: grid; gap: 14px; }
  .alias { font-size: 26px; font-weight: 800; letter-spacing: .3px; }
  .url { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px 6px 6px 12px; }
  .url span { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .list { display: grid; gap: 8px; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800;
    background: var(--surface); border: 1px solid var(--line); color: var(--accent); }
  .item .title { font-weight: 600; }
  .item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .progress { margin-top: 8px; }

  /* --- devices */
  .waiting { border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
    background: color-mix(in srgb, var(--warn) 8%, var(--surface-2)); }
  .code { font-size: 26px; font-weight: 800; letter-spacing: 6px; font-family: ui-monospace, Menlo, monospace; }
  .device { grid-template-columns: 1fr auto; }
  .device .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* --- prepare */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .job { display: grid; gap: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 10px; font-size: 14px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* --- toast and dialog */
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom));
    display: grid; gap: 8px; z-index: 20; width: min(520px, calc(100% - 24px)); }
  .toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow); font-size: 14px; animation: rise .2s ease; }
  .toast.bad { border-left-color: var(--bad); }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
  #modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center;
    background: rgba(0,0,0,.5); padding: 12px; }
  #modal .sheet { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px; box-shadow: var(--shadow); animation: rise .2s ease; }
  #modal h3 { margin: 0 0 6px; font-size: 17px; }
  #modal p { margin: 0 0 14px; color: var(--muted); white-space: pre-line; }
  #modal .row { justify-content: flex-end; }
  @media (min-width: 640px) {
    #modal { place-items: center; }
    .alias { font-size: 30px; }
  }
  @media (max-width: 420px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .item { grid-template-columns: auto 1fr; }
    .item > .actions { grid-column: 1 / -1; justify-content: stretch; }
    .item > .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo">v</div>
      <h1>vpstream</h1><span id="version" class="ver"></span>
      <div class="live"><span id="dot" class="dot"></span><span id="livetext">connecting</span></div>
    </div>
    <nav id="tabs" role="tablist">
      <button data-tab="stream" class="on" role="tab">Stream</button>
      <button data-tab="devices" role="tab">Devices<span id="waitbadge" class="badge" hidden></span></button>
      <button data-tab="prepare" role="tab">Prepare<span id="jobbadge" class="badge" hidden></span></button>
    </nav>
  </div>
</header>

<main>
  <div id="notes" class="stack"></div>

  <!-- Stream -->
  <section data-panel="stream" class="stack">
    <div id="idle" class="card" hidden>
      <h2>Start a stream</h2>
      <form id="start" class="stack" autocomplete="off">
        <div class="seg" id="kind">
          <button type="button" data-value="file" class="on">One video</button>
          <button type="button" data-value="dir">A folder</button>
        </div>
        <label class="field">Path on the server
          <input id="path" type="text" placeholder="/srv/media/film.mkv" required spellcheck="false"></label>
        <div class="seg" id="mode">
          <button type="button" data-value="direct" class="on">Direct<small>VLC and players</small></button>
          <button type="button" data-value="browser">Browser<small>TV browsers</small></button>
        </div>
        <details>
          <summary>More options</summary>
          <div class="grid2" style="margin-top:10px">
            <label class="field">Alias <input id="alias" type="text" placeholder="random" spellcheck="false"></label>
            <label class="field">Stop after (minutes, 0 = never)
              <input id="ttl" type="number" min="0" step="any" value="180" required></label>
            <label class="field">Who gets in
              <select id="policy"><option value="">the mode's default</option>
                <option value="open">Everyone (open)</option>
                <option value="approval">Only approved (approval)</option></select></label>
            <label class="field browser">Audio to start with
              <input id="audio" type="text" placeholder="default, or eng, 2" spellcheck="false"></label>
            <label class="field browser">Subtitles to start with
              <input id="sub" type="text" placeholder="off, or 1, eng" spellcheck="false"></label>
          </div>
        </details>
        <button type="submit" class="btn primary wide">Start streaming</button>
      </form>
    </div>

    <div id="live" hidden class="stack">
      <div class="card hero">
        <div class="row">
          <div class="grow">
            <div class="muted small">Streaming now</div>
            <div id="aliasname" class="alias ellipsis"></div>
          </div>
          <span id="modepill" class="pill accent"></span>
        </div>
        <div class="url"><span id="url"></span><button id="copyurl" class="btn sm" type="button">Copy</button></div>
        <div class="stats">
          <div class="stat"><b id="left"></b><span>time left</span></div>
          <div class="stat"><b id="viewers"></b><span>watching now</span></div>
          <div class="stat"><b id="port"></b><span>stream port</span></div>
        </div>
        <div class="progress" title="time left"><i id="ttlbar"></i></div>
        <div class="row">
          <input id="newalias" type="text" class="grow" placeholder="new alias" spellcheck="false" style="flex:1">
          <button id="setalias" class="btn" type="button">Rename</button>
          <button id="stop" class="btn danger" type="button">Stop</button>
        </div>
      </div>
      <div class="card">
        <h2>Videos <span id="videocount" class="muted"></span></h2>
        <div id="videos" class="list"></div>
      </div>
    </div>
  </section>

  <!-- Devices -->
  <section data-panel="devices" class="stack" hidden>
    <div class="card">
      <h2>Who gets in</h2>
      <div class="seg" id="policies">
        <button type="button" data-policy="open">Open</button>
        <button type="button" data-policy="approval">Approval</button>
        <button type="button" data-policy="locked">Locked</button>
      </div>
      <p id="policytext" class="muted small" style="margin:10px 2px 0"></p>
    </div>
    <div id="waitcard" class="card" hidden>
      <h2>Waiting to get in</h2>
      <div id="waiters" class="list"></div>
    </div>
    <div class="card">
      <h2>Devices <span id="devicecount" class="muted"></span></h2>
      <div id="devices" class="list"></div>
    </div>
  </section>

  <!-- Prepare -->
  <section data-panel="prepare" class="stack" hidden>
    <div class="card">
      <h2>Prepare for browsers</h2>
      <form id="prepareform" class="stack" autocomplete="off">
        <div class="seg" id="pkind">
          <button type="button" data-value="file" class="on">One video</button>
          <button type="button" data-value="dir">A folder</button>
        </div>
        <label class="field">Path on the server
          <input id="ppath" type="text" placeholder="/srv/media/film.mkv" required spellcheck="false"></label>
        <label class="field">Subtitle tracks
          <input id="psub" type="text" placeholder="every text track (soft)" spellcheck="false"></label>
        <div class="chips">
          <button type="button" class="btn sm ghost" data-sub="">Text tracks</button>
          <button type="button" class="btn sm ghost" data-sub="none">None</button>
          <button type="button" class="btn sm ghost" data-sub="eng">English</button>
        </div>
        <button type="submit" class="btn primary wide">Show the plan</button>
      </form>
    </div>
    <div id="plan" class="card" hidden>
      <h2>The plan</h2>
      <div id="plans" class="list"></div>
      <div class="row" style="margin-top:12px; justify-content:flex-end">
        <button id="dropplan" class="btn ghost" type="button">Never mind</button>
        <button id="queue" class="btn primary" type="button">Prepare it</button>
      </div>
    </div>
    <div class="card">
      <h2>Prepares</h2>
      <div id="jobs" class="list"></div>
    </div>
    <div class="card">
      <h2>Prepared videos <span id="cachetotal" class="muted"></span></h2>
      <div id="cache" class="list"></div>
      <div class="row" style="margin-top:12px; justify-content:flex-end">
        <button id="rmstale" class="btn danger" type="button">Remove the stale ones</button>
      </div>
    </div>
  </section>
</main>

<div id="toasts"></div>
<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="modaltitle"></h3>
    <p id="modaltext"></p>
    <div class="row"><button id="modalno" class="btn ghost" type="button">Cancel</button>
      <button id="modalyes" class="btn primary" type="button">OK</button></div>
  </div>
</div>
<script src="/assets/dashboard.js"></script>
</body>
</html>
