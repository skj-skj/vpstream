<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 26px/1.35 sans-serif; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #overlay { position: fixed; left: 4%; right: 4%; bottom: 7%; text-align: center;
    pointer-events: none; white-space: pre-line; }
  #overlay span { display: inline-block; background: rgba(0, 0, 0, .72); color: #fff;
    padding: 6px 16px; border-radius: 6px; font-size: 38px; text-shadow: 0 0 4px #000; }
  body.controls #overlay { bottom: 34%; }
  #message { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: 34px;
    pointer-events: none; text-shadow: 0 0 6px #000; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 28px 26px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .88) 30%); display: none; }
  body.controls #controls { display: block; }
  body.controls { cursor: default; }
  body { cursor: none; }
  #title { font-size: 26px; color: #ccc; margin: 0 0 10px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  #bar { position: relative; height: 34px; margin: 4px 0 14px; cursor: pointer; }
  #track { position: absolute; left: 0; right: 0; top: 12px; height: 10px; background: #555;
    border-radius: 5px; }
  #fill { position: absolute; left: 0; top: 12px; height: 10px; width: 0; background: #ffd400;
    border-radius: 5px; }
  #time { float: right; color: #ccc; font-size: 24px; margin-top: 6px; }
  #buttons { display: flex; flex-wrap: wrap; gap: 18px; }
  button { font: inherit; font-size: 28px; min-width: 120px; padding: 18px 28px;
    background: #2a2a2a; color: #fff; border: 3px solid #666; border-radius: 12px;
    cursor: pointer; }
  button:focus { outline: none; border-color: #ffd400; background: #3a3a10; }
  button.wide { min-width: 300px; text-align: left; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="controls">
<video id="video" playsinline preload="auto"></video>
<div id="overlay"></div>
<div id="message"></div>
<div id="controls">
  <div id="title"></div>
  <div id="bar"><div id="track"></div><div id="fill"></div></div>
  <div id="buttons">
    <button id="play" type="button">Play</button>
    <button id="back" type="button">&#8722;10 s</button>
    <button id="forward" type="button">+10 s</button>
    <button id="audio" class="wide" type="button">Audio</button>
    <button id="subs" class="wide" type="button">Subtitles: Off</button>
    <button id="episodes" type="button" hidden>Episodes</button>
    <button id="next" type="button" hidden>Next</button>
    <span id="time"></span>
  </div>
</div>
<script id="settings" type="application/json">{{SETTINGS}}</script>
<script src="{{ASSETS}}hls.min.js"></script>
<script src="{{ASSETS}}vtt.js"></script>
<script src="{{ASSETS}}player.js"></script>
</body>
</html>
