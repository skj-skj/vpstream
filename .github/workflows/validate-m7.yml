name: validate-m7 (temporary)

on:
  push:
    branches: [feat/milestone-7-polish]

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - run: bash scripts/ci-validate-m7.sh
        env:
          GH_TOKEN: ${{ github.token }}
