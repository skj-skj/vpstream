name: validate-m7 (temporary)

on:
  push:
    branches: [feat/milestone-7-polish]

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - run: bash scripts/ci-validate-m7.sh
