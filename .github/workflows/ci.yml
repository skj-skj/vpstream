name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" ruff mypy
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg, mkvtoolnix and Ubuntu's Caddy, as on a server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix caddy acl
          sudo systemctl disable --now caddy   # the package's own web server is not used
      - run: python -m pip install -e ".[dev]"
      - name: The current Caddy, from vpstream install caddy, as servers run it
        run: |
          vpstream install caddy --yes
          caddy version
      - name: Unit tests, and the integration tests with ffmpeg and Caddy
        run: python -m pytest --integration -n auto
      - name: selftest from the installed command
        run: vpstream selftest
      - name: install the real ffmpeg build (into a temporary folder, through sudo)
        if: matrix.python-version == '3.12'
        env:
          VPSTREAM_TEST_FFMPEG_DOWNLOAD: "1"
        run: python -m pytest --integration -k real_ffmpeg_install -v

  https:
    # HTTPS for streams: a certificate requested from Pebble (Let's Encrypt's test authority)
    # through the current Caddy, installed by `vpstream install caddy` over Ubuntu's 2.6.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ubuntu's Caddy 2.6.2 with its service off, as on a server, and Pebble
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg caddy
          sudo systemctl disable --now caddy
          caddy version
          GOBIN="$RUNNER_TEMP/bin" go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
      - run: python -m pip install -e ".[dev]"
      - name: vpstream install caddy replaces it with the current Caddy
        run: |
          vpstream install caddy --yes
          caddy version
          if systemctl is-active --quiet caddy || systemctl is-enabled --quiet caddy; then
            echo "caddy.service must be left disabled and stopped"; exit 1
          fi
          vpstream install caddy
          vpstream update caddy
      - name: HTTPS integration tests, Pebble included, and watching together over HTTPS
        env:
          VPSTREAM_PEBBLE: ${{ runner.temp }}/bin/pebble
        run: >-
          python -m pytest --integration -v -rs -n auto
          src/vpstream/tests/test_https_integration.py src/vpstream/tests/test_caddy.py
          src/vpstream/tests/test_together_integration.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains the tests and assets
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          grep -q "vpstream/tests/conftest.py" files.txt
          grep -q "vpstream/tests/data/three-cues.sup" files.txt
          grep -q "vpstream/tests/data/ip-certificate.pem" files.txt
          grep -q "vpstream/assets/hls.min.js" files.txt
          grep -q "vpstream/assets/hls.js.version" files.txt
          grep -q "vpstream/assets/caps.js" files.txt
          grep -q "vpstream/assets/dashboard.html" files.txt
          grep -q "vpstream/assets/dashboard.js" files.txt
          grep -q "vpstream/assets/player.html" files.txt
          grep -q "vpstream/assets/player.js" files.txt
          grep -q "vpstream/assets/vtt.js" files.txt
          grep -q "vpstream/tests/dashboard_test.js" files.txt
      - name: Install the wheel and run selftest
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[dev]"
          cd /tmp && /tmp/venv/bin/vpstream --version && /tmp/venv/bin/vpstream selftest

  service:
    # A clean install on this throwaway machine, from nothing to a stream and back to nothing:
    # pipx, doctor, install caddy and ffmpeg, selftest, the real init and uninstall (user,
    # sudoers, systemd and ufw), uninstall --purge and pipx uninstall. 24.04 is what servers
    # run; ubuntu-latest is the next release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - name: The prerequisites from apt, as in the README (Caddy and ffmpeg come later)
        run: |
          sudo apt-get update
          # The fonts are what `vpstream install ffmpeg` would add; apt packages stay after an
          # uninstall, so they are part of the host before vpstream.
          sudo apt-get install -y --no-install-recommends ufw pipx caddy acl mkvtoolnix \
            fontconfig fonts-dejavu-core fonts-liberation fonts-noto-cjk
          sudo systemctl disable --now caddy   # the package's own web server is not used
      - name: Make the image's own sudoers files valid (24.04's has bad permissions for visudo)
        run: |
          sudo find /etc/sudoers.d -type f -exec chmod 0440 {} +   # the folder is root's only
          sudo visudo -c
      - name: Stand in for Tailscale (the runner is on no tailnet)
        run: sudo install -m 0755 scripts/ci-fake-tailscale /usr/local/bin/tailscale
      - name: From nothing to a stream and back to nothing
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub's API limit, for install ffmpeg
        run: scripts/ci-clean-install.sh "$(ls "$PWD"/dist/*.whl)"
