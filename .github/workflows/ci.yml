name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" ruff mypy
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg, mkvtoolnix and Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix caddy acl
          sudo systemctl disable --now caddy   # the package's own web server is not used
          caddy version
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests, and the integration tests with ffmpeg and Caddy
        run: python -m pytest --integration
      - name: selftest from the installed command
        run: vpstream selftest
      - name: install the real ffmpeg build (into a temporary folder, through sudo)
        if: matrix.python-version == '3.12'
        env:
          VPSTREAM_TEST_FFMPEG_DOWNLOAD: "1"
        run: python -m pytest --integration -k real_ffmpeg_install -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains the tests and assets
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          grep -q "vpstream/tests/conftest.py" files.txt
          grep -q "vpstream/tests/data/three-cues.sup" files.txt
          grep -q "vpstream/assets/hls.min.js" files.txt
          grep -q "vpstream/assets/hls.js.version" files.txt
          grep -q "vpstream/assets/caps.js" files.txt
          grep -q "vpstream/assets/dashboard.html" files.txt
          grep -q "vpstream/assets/dashboard.js" files.txt
          grep -q "vpstream/assets/player.html" files.txt
          grep -q "vpstream/assets/player.js" files.txt
          grep -q "vpstream/assets/vtt.js" files.txt
      - name: Install the wheel and run selftest
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[dev]"
          cd /tmp && /tmp/venv/bin/vpstream --version && /tmp/venv/bin/vpstream selftest

  service:
    # The real init and uninstall, on this throwaway machine: user, sudoers, systemd and ufw.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - name: Install ufw, pipx, Caddy and the ACL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ufw pipx caddy acl
          sudo systemctl disable --now caddy   # the package's own web server is not used
      - name: Install vpstream for the whole system
        run: |
          # Not under /opt as on a normal host: the runner's /opt carries a default ACL that
          # makes everything in it writable by every user, and init rightly refuses that.
          wheel="$(ls "$PWD"/dist/*.whl)"
          sudo PIPX_HOME=/srv/vpstream-pipx PIPX_BIN_DIR=/usr/local/bin \
            /usr/bin/pipx install --python /usr/bin/python3 "${wheel}[dev]"
          vpstream --version
      - name: Stand in for Tailscale (the runner is on no tailnet)
        run: sudo install -m 0755 scripts/ci-fake-tailscale /usr/local/bin/tailscale
      - name: init, a stream, helper, restart, crash, uninstall
        run: scripts/ci-service-check.sh

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
