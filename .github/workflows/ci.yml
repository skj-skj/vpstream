name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" ruff mypy
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg and mkvtoolnix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - run: python -m pip install -e ".[dev]"
      - name: Unit and ffmpeg integration tests
        run: python -m pytest --integration
      - name: selftest from the installed command
        run: vpstream selftest
      - name: TEMP time the font install
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import subprocess, threading, time, sys
          t0 = time.time()
          def log(tag, line): print(f"{time.time()-t0:7.1f} {tag} {line.rstrip()}", flush=True)
          p = subprocess.Popen(["sudo", "env", "DEBIAN_FRONTEND=noninteractive", "apt-get", "install", "-y",
                                "--no-install-recommends", "fonts-noto-cjk"],
                               stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          def pump(f, tag):
              for line in f: log(tag, line)
              log(tag, "<EOF>")
          th = [threading.Thread(target=pump, args=(p.stdout, "out")), threading.Thread(target=pump, args=(p.stderr, "err"))]
          for t in th: t.start()
          def watch():
              n = 0
              while any(t.is_alive() for t in th):
                  time.sleep(20); n += 1
                  if any(t.is_alive() for t in th):
                      log("ps", f"exit={p.poll()}")
                      print(subprocess.run("ps -eo pid,ppid,etimes,args --forest | grep -v 'ps -eo' | tail -40", shell=True, capture_output=True, text=True).stdout, flush=True)
          w = threading.Thread(target=watch); w.start()
          rc = p.wait(); log("rc", str(rc))
          for t in th: t.join()
          log("done", "")
          PY
      - name: install the real ffmpeg build (into a temporary folder, through sudo)
        if: matrix.python-version == '3.12'
        env:
          VPSTREAM_TEST_FFMPEG_DOWNLOAD: "1"
        run: python -m pytest --integration -k real_ffmpeg_install -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains the tests and assets
        run: |
          python -m zipfile -l dist/*.whl > files.txt
          grep -q "vpstream/tests/conftest.py" files.txt
          grep -q "vpstream/tests/data/three-cues.sup" files.txt
          grep -q "vpstream/assets/hls.min.js" files.txt
          grep -q "vpstream/assets/hls.js.version" files.txt
          grep -q "vpstream/assets/caps.js" files.txt
      - name: Install the wheel and run selftest
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[dev]"
          cd /tmp && /tmp/venv/bin/vpstream --version && /tmp/venv/bin/vpstream selftest

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
