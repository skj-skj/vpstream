[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vpstream"
version = "0.8.0"
description = "On-demand video streaming from a VPS, controlled over SSH or a private dashboard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/vpstream/assets/hls.js.LICENSE"]
requires-python = ">=3.12"
dependencies = ["flask>=3.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vpstream = "vpstream.cli:main"
vpstream-fw = "vpstream.firewall:main"

[tool.hatch.build.targets.sdist]
include = ["src/vpstream", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/vpstream"]

[tool.pytest.ini_options]
testpaths = ["src/vpstream/tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vpstream"]
exclude = ["src/vpstream/tests/"]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
build_command = "python -m pip install build && python -m build"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
